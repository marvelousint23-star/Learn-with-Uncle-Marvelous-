<!DOCTYPE html>

<html lang="en">
<head>

  *{

  body{

  .calculator {
    width:320px;
    background:#ffffff;

  .display { 
    width:100%;

    margin-button: 20px;

  .button { 
      display:grid;
      grid:template-column;repeat(4,1fr);
      gap:12px;}
   .button { 
      height:60px;
      border:none;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      background:#e4e7ec;

   .button:hover {

    .Operator:{

    .clear{

  </style>
  </head>
  <body>
  <div class="calculator">
       <input type="text" id="display"class="display"disabled>
       <button class="clear"onclick="clearDisplay()">C</button>
       <button> class="operator"onclick"append('/')">÷</button>
       <button> class="operator"onclick"append('*')">*</button>
       
     
       <button>onclick="append('7')">7</button>
       <button>onclick="append('8')">8</button>
       <button>onclick="append('9')">9</button>
       <button> class="operator"onclick"append('+')">+</button>
    
       <button>onclick="append('4')">4</button>
       <button>onclick="append('5')">5</button>
       <button>onclick="append('6')">6</button>
        <button> class="operator"onclick"append('-')">-</button>
    
       <button>onclick="append('1')">1</button>
       <button>onclick="append('2')">2</button>
       <button>onclick="append('3')">3</button>
       <button>onclick="append('0')">0</button>
       <button class="equal" onclicj=calculator()">=</button>
    </div>
    </div>
  <script>
     function append (value){ document.getElementById("display").value + =value;}
     function clearDisplay (){ document.getElementById("display").value="";}
     function calculate (){ try} { document.getElementById("display").value=
     function ("return"+ { document.getElementById("display").value)();}
        catch { documentById("display").value="Error"} }
   </script>
  </body>
  </html>
